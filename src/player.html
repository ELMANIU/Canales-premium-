<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Fénix TV</title>

<style>

body{
margin:0;
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

video{
width:100%;
max-width:1200px;
height:auto;
}

</style>

</head>


<body>


<video id="video" controls autoplay playsinline></video>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>


const video = document.getElementById("video");


// ==========================
// LEER CANAL DE LA URL
// ==========================

const params = new URLSearchParams(window.location.search);

const canal = params.get("canal");


// Worker

const worker =
"https://canales-premiu.elmanuchale.workers.dev";


// Crear URL dinámica

const stream =
`${worker}/${canal}/index.m3u8`;



console.log("Reproduciendo:", stream);



if(Hls.isSupported()){


const hls = new Hls({

liveSyncDurationCount:5,

liveMaxLatencyDurationCount:10,

enableWorker:true,

lowLatencyMode:false

});


hls.loadSource(stream);

hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

video.play();

});


hls.on(
Hls.Events.ERROR,
(event,data)=>{

console.log(data);

});


}


else if(
video.canPlayType(
"application/vnd.apple.mpegurl"
)
){

video.src=stream;

}


</script>


</body>
</html>
